server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Cabeceras de seguridad básicas
    # Nota: no uso add_header dentro de los location de abajo, porque nginx
    # dejaría de heredar estas. Por eso el caché se controla con "expires".
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # El navegador llama al mismo origen; Nginx resuelve "backend" dentro de Compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre (Vite: /assets, CRA: /static) -> caché 1 año
    location ~ ^/(assets|static)/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html nunca se cachea, para que los deploys se vean al instante
    location = /index.html {
        expires -1;
    }

    # Fallback de SPA (React Router, etc.)
    location / {
        try_files $uri /index.html;
    }
}